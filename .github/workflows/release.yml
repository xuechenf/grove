name: Release

# Build the desktop app on each platform's own runner (electron-builder can't cross-compile a
# macOS app from Windows/Linux). Each runner uploads its result, then one Linux job publishes the
# combined set so parallel builders cannot create duplicate GitHub Release records for one tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (UI + Electron bundle)
        run: npm run build:app

      - name: Build installers
        run: npx --no-install electron-builder --publish never
        env:
          # No Apple certificate yet — skip code signing so macOS builds don't fail.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grove-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: grove-*
          path: release
          merge-multiple: true

      - name: Publish one GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Grove $version" \
            --generate-notes
